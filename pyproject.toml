[project]
name = "match-voice"
version = "0.1.0"
description = "Real-time multilingual match commentary from synthetic football events"
requires-python = ">=3.11"
dependencies = [
  "agent-framework-core>=1.22",
  "agent-framework-anthropic>=1.0.0b261015",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "orjson>=3.10",
  "sse-starlette>=2.1",
  "mcp>=1.30,<2",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F"]
