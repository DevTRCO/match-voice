# Optional: publishes the static demo to GitHub Pages when run by hand. The public demo is on Azure Static Web Apps (docs/DEPLOY.md).
# Builds the static demo (recorded insert, no server, no key) and publishes ui/dist-static. Pages must be enabled with
# "Source: GitHub Actions" in the repository settings.
name: Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run build:static
      - name: Check the build
        run: |
          test -f dist-static/index.html
          test -f dist-static/insert/story.json
          if ls dist-static/mock*.html >/dev/null 2>&1; then echo "design mocks in the build"; exit 1; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ui/dist-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
